name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Install locked development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Tests (offline fixtures)
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
      - name: Reproducible profiling smoke test
        run: python -m src.analysis.profile_sources data/samples/test_fixture.csv --output reports/test-profile.json --date FECHA --date-format %d/%m/%Y --id CUI --location PROVINCIA --text TEXTO
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence
          path: reports/
          retention-days: 14
          if-no-files-found: warn
